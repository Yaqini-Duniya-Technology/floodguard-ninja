name: FloodGuard deployment checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete v2.8 source
        run: |
          test -f backend/requirements.txt || { echo "::error::Missing backend/requirements.txt. Import v2.8 source before merging."; exit 1; }
          test -f backend/app/main.py || { echo "::error::Missing backend/app/main.py. Import v2.8 source before merging."; exit 1; }
          test -f render.yaml || { echo "::error::Missing render.yaml."; exit 1; }
          test -f vercel.json || { echo "::error::Missing vercel.json."; exit 1; }
          test ! -f backend/floodguard.sqlite3 || { echo "::error::Do not commit local SQLite data."; exit 1; }
  backend:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests
  frontend:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci
          npm run build
