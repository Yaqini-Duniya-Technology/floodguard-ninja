name: FloodGuard deployment checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend presence
        id: presence
        run: |
          if [ -f backend/requirements.txt ] && [ -f backend/app/main.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::v2.8 backend source not imported yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.presence.outputs.present == 'true'
        with:
          python-version: '3.12'
      - name: Install and test backend
        if: steps.presence.outputs.present == 'true'
        run: |
          python -m pip install -r backend/requirements.txt pytest
          python -m pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm ci
          npm run build
