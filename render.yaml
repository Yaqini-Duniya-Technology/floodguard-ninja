services:
  - type: web
    name: floodguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FLOODGUARD_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FLOODGUARD_ALLOWED_ORIGINS
        sync: false
      - key: NIPOST_INTEGRATION_ENABLED
        value: 'false'
